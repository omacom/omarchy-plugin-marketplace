name: Verify listed plugin

on:
  workflow_call:

concurrency:
  group: >-
    ${{ (startsWith(github.event.issue.title, '[Verify]:') ||
     (github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified')) &&
    ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
     (github.event.action == 'labeled' && (github.event.label.name == 'maintainer-verified' || github.event.label.name == 'standard-installation-approved')) ||
     (github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified')) &&
    'plugin-catalog-writes' || format('ignored-verification-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  route:
    if: >-
      ((github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified') ||
       (startsWith(github.event.issue.title, '[Verify]:') && github.event.issue.state == 'open')) &&
      !github.event.issue.pull_request &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       (github.event.action == 'labeled' &&
        (github.event.label.name == 'maintainer-verified' || github.event.label.name == 'standard-installation-approved') &&
        github.run_attempt == 1) ||
       (github.event.action == 'unlabeled' &&
        github.event.label.name == 'maintainer-verified'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: none
    outputs:
      action: ${{ steps.route.outputs.action }}
    steps:
      - name: Route exact verification action
        id: route
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const body = process.env.ISSUE_BODY || "";
          const match = body.match(/^### Verification action\s*\r?\n\r?\n([^\r\n]+)\s*$/m);
          const selected = match?.[1]?.trim();
          const eventAction = process.env.EVENT_ACTION || "";
          const labelName = process.env.LABEL_NAME || "";
          const action = eventAction === "unlabeled" && labelName === "maintainer-verified"
            ? "revocation"
            : selected === "Verify and publish a newer upstream commit"
              ? "update"
              : selected === "Verify the listed snapshot and enable standard installation"
                ? (eventAction === "labeled" && labelName === "standard-installation-approved" ? "installation" : "waiting")
                : "listed";
          appendFileSync(process.env.GITHUB_OUTPUT, `action=${action}\n`);
          NODE

  analyze:
    if: needs.route.outputs.action == 'listed' || needs.route.outputs.action == 'installation' || needs.route.outputs.action == 'revocation'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.verification.outputs.result }}
      changed: ${{ steps.verification.outputs.changed }}
      plugin_id: ${{ steps.verification.outputs.plugin_id }}
      commit_sha: ${{ steps.verification.outputs.commit_sha }}
      verification_method: ${{ steps.verification.outputs.verification_method }}
      maintainer_review_requested: ${{ steps.verification.outputs.maintainer_review_requested }}
      installation_changed: ${{ steps.verification.outputs.installation_changed }}
      maintainer_review_event_id: ${{ steps.review-authorization.outputs.event_id }}
      standard_installation_approval_event_id: ${{ steps.standard-installation-authorization.outputs.event_id }}
      revocation_event_id: ${{ steps.revocation-authorization.outputs.event_id }}
      revocation_event_time: ${{ steps.revocation-authorization.outputs.event_time }}
      revocation_review_event_id: ${{ steps.revocation-authorization.outputs.review_event_id }}
      base_commit: ${{ steps.base.outputs.commit }}
      report_artifact_name: ${{ steps.identity.outputs.report_name }}
      publication_artifact_name: ${{ steps.identity.outputs.publication_name }}
      pages_artifact_name: ${{ steps.identity.outputs.pages_name }}
      deployment_id: ${{ steps.identity.outputs.deployment_id }}
      publication_sha: ${{ steps.bundle.outputs.publication_sha }}
      catalog_sha: ${{ steps.bundle.outputs.catalog_sha }}
      explorer_sha: ${{ steps.bundle.outputs.explorer_sha }}
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          filter: blob:none

      - name: Record verification base commit
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record immutable artifact identities
        id: identity
        run: |
          set -euo pipefail
          echo "report_name=plugin-verification-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "publication_name=plugin-verification-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "pages_name=plugin-verification-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install verification dependencies
        run: npm ci

      - name: Authorize standard installation approval
        id: standard-installation-authorization
        if: github.event.action == 'labeled' && github.event.label.name == 'standard-installation-approved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEWER: ${{ github.actor }}
          APPROVAL_REQUESTED_AT: ${{ github.event.issue.updated_at }}
        run: |
          set -euo pipefail
          events="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100")"
          transition="$(jq -r --arg requested_at "$APPROVAL_REQUESTED_AT" --arg reviewer "$REVIEWER" '
            [.[][] | select(.event == "labeled" and .label.name == "standard-installation-approved" and .actor.login == $reviewer and .created_at == $requested_at)]
            | sort_by(.created_at, .id)
            | [.[] | .id] | @tsv
          ' <<< "$events")"
          if [[ ! $transition =~ ^[1-9][0-9]*$ ]]; then
            echo "Standard installation approval label event does not match the workflow trigger." >&2
            exit 1
          fi
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${REVIEWER}/permission" --jq '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "${REVIEWER} does not have write permission for standard installation approval." >&2; exit 1 ;;
          esac
          echo "event_id=${transition}" >> "$GITHUB_OUTPUT"

      - name: Authorize maintainer verification revocation
        id: revocation-authorization
        if: github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEWER: ${{ github.actor }}
          REVOCATION_REQUESTED_AT: ${{ github.event.issue.updated_at }}
        run: |
          set -euo pipefail
          events="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100")"
          transition="$(jq -r --arg reviewer "$REVIEWER" '
            [.[][] | select(.event == "unlabeled" and .label.name == "maintainer-verified" and .actor.login == $reviewer)]
            | sort_by(.created_at, .id)
            | last
            | [.id, .created_at] | @tsv
          ' <<< "$events")"
          IFS=$'\t' read -r transition_id transition_time <<< "$transition"
          if [[ ! $transition_id =~ ^[1-9][0-9]*$ ]] || ! date -u -d "$transition_time" >/dev/null 2>&1; then
            echo "Maintainer verification revocation event does not match the workflow trigger." >&2
            exit 1
          fi
          known_review_event_ids="$(jq -c '[.sources[]?.maintainerVerificationReview?.requestEventId | select(type == "number")]' registry.json)"
          review_event_id="$(jq -r --argjson review_ids "$known_review_event_ids" --argjson revocation_id "$transition_id" '
            [.[][] | select(
              .event == "labeled"
              and .label.name == "maintainer-verified"
              and (.id < $revocation_id)
              and (.id as $id | ($review_ids | index($id)) != null)
            )]
            | sort_by(.created_at, .id) | last.id // ""
          ' <<< "$events")"
          if [[ ! $review_event_id =~ ^[1-9][0-9]*$ ]]; then
            echo "The revocation event has no preceding maintainer verification label event." >&2
            exit 1
          fi
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${REVIEWER}/permission" --jq '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "${REVIEWER} does not have write permission for maintainer verification revocation." >&2; exit 1 ;;
          esac
          echo "event_id=${transition_id}" >> "$GITHUB_OUTPUT"
          echo "event_time=${transition_time}" >> "$GITHUB_OUTPUT"
          echo "review_event_id=${review_event_id}" >> "$GITHUB_OUTPUT"

      - name: Authorize maintainer verification review
        id: review-authorization
        if: github.event.action == 'labeled' && github.event.label.name == 'maintainer-verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEWER: ${{ github.actor }}
          REVIEW_REQUESTED_AT: ${{ github.event.issue.updated_at }}
        run: |
          set -euo pipefail
          review_events="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100"
          )"
          latest_review_transition="$(
            jq -r --arg requested_at "$REVIEW_REQUESTED_AT" '
              [.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "maintainer-verified")] as $events
              | ($events | sort_by(.created_at, .id) | last) as $latest
              | [$latest.id, $latest.event, $latest.actor.login, $latest.created_at, ($events | map(select(.created_at == $requested_at)) | length)]
              | @tsv
            ' <<< "$review_events"
          )"
          IFS=$'\t' read -r event_id event_name event_actor event_time matching_event_count <<< "$latest_review_transition"
          known_revocation_event_ids="$(
            jq -c '[.sources[]?.maintainerVerificationRevocation?.revocationEventId | select(type == "number")]' registry.json
          )"
          latest_revocation_time="$(
            jq -r --arg requested_at "$REVIEW_REQUESTED_AT" --argjson revocation_ids "$known_revocation_event_ids" '
              [.[][] | select(
                .event == "unlabeled"
                and .label.name == "maintainer-verified"
                and .created_at < $requested_at
                and (.id as $id | ($revocation_ids | index($id)) != null)
              )]
              | (sort_by(.created_at, .id) | last // {})
              | .created_at // ""
            ' <<< "$review_events"
          )"
          if [[ ! $event_id =~ ^[1-9][0-9]*$ ]] \
            || [ "$event_name" != labeled ] \
            || [ "$event_actor" != "$REVIEWER" ] \
            || [ "$event_time" != "$REVIEW_REQUESTED_AT" ] \
            || [ "$matching_event_count" != 1 ]; then
            echo "Maintainer verification label event does not match the workflow trigger." >&2
            exit 1
          fi
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${REVIEWER}/permission" --jq '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "${REVIEWER} does not have write permission for maintainer verification." >&2; exit 1 ;;
          esac
          review_comment="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              | jq -c '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification -->")))] | sort_by(.created_at, .id) | last // {}'
          )"
          review_comment_id="$(jq -r '.id // ""' <<< "$review_comment")"
          review_comment_updated_at="$(jq -r '.updated_at // ""' <<< "$review_comment")"
          review_report="$(jq -r '.body // ""' <<< "$review_comment")"
          if [[ ! $review_comment_id =~ ^[1-9][0-9]*$ ]] \
            || [[ ! $review_comment_updated_at < $REVIEW_REQUESTED_AT ]] \
            || ! grep -Fq '<!-- marketplace-maintainer-verification-expectation:v1 ' <<< "$review_report"; then
            echo "The latest bot verification report has no eligible maintainer-review expectation." >&2
            exit 1
          fi
          printf '%s\n' "$review_report" > "$RUNNER_TEMP/maintainer-review-report.md"
          report_checked_at="$(
            REPORT_PATH="$RUNNER_TEMP/maintainer-review-report.md" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const body = readFileSync(process.env.REPORT_PATH, "utf8");
          const encoded = body.match(/<!-- marketplace-maintainer-verification-expectation:v1 ([A-Za-z0-9_-]+) -->/)?.[1];
          if (!encoded) process.exit(1);
          const expectation = JSON.parse(Buffer.from(encoded, "base64url").toString("utf8"));
          if (typeof expectation.checkedAt !== "string") process.exit(1);
          process.stdout.write(expectation.checkedAt);
          NODE
          )"
          if [ -n "$latest_revocation_time" ] \
            && ! jq -n -e --arg report_time "$report_checked_at" --arg revocation_time "$latest_revocation_time" '$report_time > $revocation_time' >/dev/null; then
            echo "A maintainer review after a revocation requires a fresh bot verification report." >&2
            exit 1
          fi
          echo "event_id=${event_id}" >> "$GITHUB_OUTPUT"

      - name: Analyze exact listed commit
        id: verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MAINTAINER_REVIEW_REQUESTED: ${{ github.event.action == 'labeled' && github.event.label.name == 'maintainer-verified' }}
          MAINTAINER_REVIEWER: ${{ github.actor }}
          MAINTAINER_REVIEW_EVENT_ID: ${{ steps.review-authorization.outputs.event_id }}
          MAINTAINER_REVIEW_REQUESTED_AT: ${{ github.event.issue.updated_at }}
          MAINTAINER_REVIEW_REPORT_PATH: ${{ runner.temp }}/maintainer-review-report.md
          STANDARD_INSTALLATION_APPROVAL_REQUESTED: ${{ github.event.action == 'labeled' && github.event.label.name == 'standard-installation-approved' }}
          STANDARD_INSTALLATION_APPROVAL_REVIEWER: ${{ github.actor }}
          STANDARD_INSTALLATION_APPROVAL_EVENT_ID: ${{ steps.standard-installation-authorization.outputs.event_id }}
          STANDARD_INSTALLATION_APPROVAL_REQUESTED_AT: ${{ github.event.issue.updated_at }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
          REVOCATION_REVIEWER: ${{ github.actor }}
          REVOCATION_EVENT_ID: ${{ steps.revocation-authorization.outputs.event_id }}
          REVOCATION_REVIEW_EVENT_ID: ${{ steps.revocation-authorization.outputs.review_event_id }}
          REVOCATION_REQUESTED_AT: ${{ steps.revocation-authorization.outputs.event_time }}
        run: |
          node scripts/verify-listed-plugin.mjs \
            --registry=registry.json \
            --catalog=site/catalog.json \
            --output-dir="$RUNNER_TEMP/plugin-verification-report"

      - name: Bundle verification report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/plugin-verification-report"
          test -f "$report/verification-result.json"
          test -f "$report/verification-report.md"
          (
            cd "$report"
            sha256sum verification-report.md verification-result.json > SHA256SUMS
          )

      - name: Upload verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.report_name }}
          path: ${{ runner.temp }}/plugin-verification-report
          if-no-files-found: error
          retention-days: 7

      - name: Record verification deployment identity
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        run: printf '%s\n' '${{ steps.identity.outputs.deployment_id }}' > site/deployment-id.txt

      - name: Build Explorer data for verified marketplace state
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        run: npm run build:explorer

      - name: Test verified marketplace state
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        run: npm test

      - name: Bundle tested verification publication
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        id: bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/plugin-verification-publication"
          mkdir -p "$bundle/site"
          cp registry.json "$bundle/registry.json"
          cp site/catalog.json "$bundle/site/catalog.json"
          cp site/explorer-data.json "$bundle/site/explorer-data.json"
          (
            cd "$bundle"
            sha256sum registry.json site/catalog.json site/explorer-data.json > SHA256SUMS
          )
          read -r catalog_sha _ < <(sha256sum site/catalog.json)
          read -r explorer_sha _ < <(sha256sum site/explorer-data.json)
          read -r publication_sha _ < <(sha256sum "$bundle/SHA256SUMS")
          echo "catalog_sha=${catalog_sha}" >> "$GITHUB_OUTPUT"
          echo "explorer_sha=${explorer_sha}" >> "$GITHUB_OUTPUT"
          echo "publication_sha=${publication_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload tested verification publication
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.publication_name }}
          path: ${{ runner.temp }}/plugin-verification-publication
          if-no-files-found: error
          retention-days: 7

      - name: Upload tested verification Pages artifact
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.identity.outputs.pages_name }}
          path: site
          retention-days: 7

      - name: Confirm verification issue is still current
        if: (steps.verification.outputs.result == 'verified' || steps.verification.outputs.result == 'revoked') && steps.verification.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          MAINTAINER_REVIEW_REQUESTED: ${{ steps.verification.outputs.maintainer_review_requested }}
          MAINTAINER_REVIEWER: ${{ github.actor }}
          MAINTAINER_REVIEW_EVENT_ID: ${{ steps.review-authorization.outputs.event_id }}
          MAINTAINER_REVIEW_REQUESTED_AT: ${{ github.event.issue.updated_at }}
          STANDARD_INSTALLATION_APPROVAL_REQUESTED: ${{ github.event.action == 'labeled' && github.event.label.name == 'standard-installation-approved' }}
          STANDARD_INSTALLATION_APPROVAL_EVENT_ID: ${{ steps.standard-installation-authorization.outputs.event_id }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
          REVOCATION_EVENT_ID: ${{ steps.revocation-authorization.outputs.event_id }}
          REVOCATION_REQUESTED_AT: ${{ steps.revocation-authorization.outputs.event_time }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if [ "$REVOCATION_REQUESTED" = true ]; then
            jq -e '(.state == "open" or .state == "closed") and (.pull_request | not)' <<< "$issue" >/dev/null
          elif ! jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null; then
            echo "Verification issue is no longer open." >&2
            exit 1
          fi
          if [ "$REVOCATION_REQUESTED" != true ]; then
            if ! jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null; then
              echo "Verification issue title changed after analysis." >&2
              exit 1
            fi
            current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
            expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
            if [ "$current_body_sha" != "$expected_body_sha" ]; then
              echo "Verification issue body changed after analysis." >&2
              exit 1
            fi
          fi
          if [ "$STANDARD_INSTALLATION_APPROVAL_REQUESTED" = true ]; then
            jq -e 'any(.labels[]?; .name == "standard-installation-approved")' <<< "$issue" >/dev/null
            latest_installation_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select(.event == "labeled" and .label.name == "standard-installation-approved")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_installation_transition="$(printf '%s\tlabeled\t%s\t%s' "$STANDARD_INSTALLATION_APPROVAL_EVENT_ID" "$MAINTAINER_REVIEWER" "$MAINTAINER_REVIEW_REQUESTED_AT")"
            test "$latest_installation_transition" = "$expected_installation_transition"
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Standard installation approval permission changed after analysis." >&2; exit 1 ;;
            esac
          elif [ "$REVOCATION_REQUESTED" = true ]; then
            if jq -e 'any(.labels[]?; .name == "maintainer-verified")' <<< "$issue" >/dev/null; then
              echo "Maintainer verification label was reapplied before revocation publication." >&2
              exit 1
            fi
            latest_revocation_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select(.event == "unlabeled" and .label.name == "maintainer-verified")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_revocation_transition="$(printf '%s\tunlabeled\t%s\t%s' "$REVOCATION_EVENT_ID" "$MAINTAINER_REVIEWER" "$REVOCATION_REQUESTED_AT")"
            test "$latest_revocation_transition" = "$expected_revocation_transition"
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Maintainer verification revocation permission changed after analysis." >&2; exit 1 ;;
            esac
          elif [ "$MAINTAINER_REVIEW_REQUESTED" = true ]; then
            jq -e 'any(.labels[]?; .name == "maintainer-verified")' <<< "$issue" >/dev/null
            latest_review_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "maintainer-verified")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_review_transition="$(printf '%s\tlabeled\t%s\t%s' "$MAINTAINER_REVIEW_EVENT_ID" "$MAINTAINER_REVIEWER" "$MAINTAINER_REVIEW_REQUESTED_AT")"
            if [ "$latest_review_transition" != "$expected_review_transition" ]; then
              echo "Maintainer verification label changed after the review request." >&2
              exit 1
            fi
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Maintainer verification permission changed after analysis." >&2; exit 1 ;;
            esac
          fi

  publish:
    if: >-
      (github.event.action != 'labeled' || github.run_attempt == 1) &&
      (needs.analyze.outputs.result == 'verified' || needs.analyze.outputs.result == 'revoked') &&
      needs.analyze.outputs.changed == 'true'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      issues: read
    outputs:
      published_commit: ${{ steps.publish.outputs.commit }}
    steps:
      - name: Check out tested verification base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.analyze.outputs.base_commit }}
          persist-credentials: false

      - name: Download tested verification publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.analyze.outputs.publication_artifact_name }}
          path: ${{ runner.temp }}/plugin-verification-publication

      - name: Verify and apply tested verification publication
        env:
          EXPECTED_CATALOG_SHA: ${{ needs.analyze.outputs.catalog_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.analyze.outputs.explorer_sha }}
          EXPECTED_PUBLICATION_SHA: ${{ needs.analyze.outputs.publication_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/plugin-verification-publication"
          if [ -n "$(find "$bundle" -type l -print -quit)" ]; then
            echo "Artifact contains an unexpected symbolic link." >&2
            exit 1
          fi
          if [ -n "$(find "$bundle" -mindepth 1 ! -type d ! -type f ! -type l -print -quit)" ]; then
            echo "Artifact contains an unsupported file type." >&2
            exit 1
          fi
          actual_files="$(cd "$bundle" && find . -type f -printf '%P\n' | sort)"
          expected_files="$(printf '%s\n' SHA256SUMS registry.json site/catalog.json site/explorer-data.json | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Artifact contains unexpected publication files." >&2
            exit 1
          fi
          read -r artifact_publication_sha _ < <(sha256sum "$bundle/SHA256SUMS")
          test "$artifact_publication_sha" = "$EXPECTED_PUBLICATION_SHA"
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          read -r artifact_catalog_sha _ < <(sha256sum "$bundle/site/catalog.json")
          test "$artifact_catalog_sha" = "$EXPECTED_CATALOG_SHA"
          read -r artifact_explorer_sha _ < <(sha256sum "$bundle/site/explorer-data.json")
          test "$artifact_explorer_sha" = "$EXPECTED_EXPLORER_SHA"
          cp "$bundle/registry.json" registry.json
          cp "$bundle/site/catalog.json" site/catalog.json
          cp "$bundle/site/explorer-data.json" site/explorer-data.json
          git diff --exit-code -- . ':!registry.json' ':!site/catalog.json' ':!site/explorer-data.json'

      - name: Recheck issue state before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          MAINTAINER_REVIEW_REQUESTED: ${{ needs.analyze.outputs.maintainer_review_requested }}
          MAINTAINER_REVIEWER: ${{ github.actor }}
          MAINTAINER_REVIEW_EVENT_ID: ${{ needs.analyze.outputs.maintainer_review_event_id }}
          MAINTAINER_REVIEW_REQUESTED_AT: ${{ github.event.issue.updated_at }}
          STANDARD_INSTALLATION_APPROVAL_REQUESTED: ${{ github.event.action == 'labeled' && github.event.label.name == 'standard-installation-approved' }}
          STANDARD_INSTALLATION_APPROVAL_EVENT_ID: ${{ needs.analyze.outputs.standard_installation_approval_event_id }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
          REVOCATION_EVENT_ID: ${{ needs.analyze.outputs.revocation_event_id }}
          REVOCATION_REQUESTED_AT: ${{ needs.analyze.outputs.revocation_event_time }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if [ "$REVOCATION_REQUESTED" = true ]; then
            jq -e '(.state == "open" or .state == "closed") and (.pull_request | not)' <<< "$issue" >/dev/null
          elif ! jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null; then
            echo "Verification issue is no longer open." >&2
            exit 1
          fi
          if [ "$REVOCATION_REQUESTED" != true ]; then
            if ! jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null; then
              echo "Verification issue title changed before publication." >&2
              exit 1
            fi
            current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
            expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
            test "$current_body_sha" = "$expected_body_sha"
          fi
          if [ "$MAINTAINER_REVIEW_REQUESTED" = true ]; then
            jq -e 'any(.labels[]?; .name == "maintainer-verified")' <<< "$issue" >/dev/null
            latest_review_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "maintainer-verified")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_review_transition="$(printf '%s\tlabeled\t%s\t%s' "$MAINTAINER_REVIEW_EVENT_ID" "$MAINTAINER_REVIEWER" "$MAINTAINER_REVIEW_REQUESTED_AT")"
            if [ "$latest_review_transition" != "$expected_review_transition" ]; then
              echo "Maintainer verification label changed before publication." >&2
              exit 1
            fi
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Maintainer verification permission changed before publication." >&2; exit 1 ;;
            esac
          fi

      - name: Commit and push tested verification
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BASE_COMMIT: ${{ needs.analyze.outputs.base_commit }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLUGIN_ID: ${{ needs.analyze.outputs.plugin_id }}
          VERIFICATION_METHOD: ${{ needs.analyze.outputs.verification_method }}
          INSTALLATION_CHANGED: ${{ needs.analyze.outputs.installation_changed }}
          MAINTAINER_REVIEW_REQUESTED: ${{ needs.analyze.outputs.maintainer_review_requested }}
          MAINTAINER_REVIEWER: ${{ github.actor }}
          MAINTAINER_REVIEW_EVENT_ID: ${{ needs.analyze.outputs.maintainer_review_event_id }}
          MAINTAINER_REVIEW_REQUESTED_AT: ${{ github.event.issue.updated_at }}
          STANDARD_INSTALLATION_APPROVAL_REQUESTED: ${{ github.event.action == 'labeled' && github.event.label.name == 'standard-installation-approved' }}
          STANDARD_INSTALLATION_APPROVAL_EVENT_ID: ${{ needs.analyze.outputs.standard_installation_approval_event_id }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
          REVOCATION_EVENT_ID: ${{ needs.analyze.outputs.revocation_event_id }}
          REVOCATION_REQUESTED_AT: ${{ needs.analyze.outputs.revocation_event_time }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json site/catalog.json site/explorer-data.json
          git diff --cached --check
          if [ "$INSTALLATION_CHANGED" = true ]; then
            subject="Enable standard installation for ${PLUGIN_ID} (#${ISSUE_NUMBER})"
          elif [ "$REVOCATION_REQUESTED" = true ]; then
            subject="Revoke maintainer verification for ${PLUGIN_ID} (#${ISSUE_NUMBER})"
          elif [ "$VERIFICATION_METHOD" = maintainer-reviewed ]; then
            subject="Verify ${PLUGIN_ID} after maintainer review (#${ISSUE_NUMBER})"
          else
            subject="Verify ${PLUGIN_ID} plugin (#${ISSUE_NUMBER})"
          fi
          git commit -m "$subject"

          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$EXPECTED_BASE_COMMIT" ]; then
            echo "main changed after the tested verification; refusing to rebase or publish stale artifacts." >&2
            exit 1
          fi

          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if [ "$REVOCATION_REQUESTED" = true ]; then
            jq -e '(.state == "open" or .state == "closed") and (.pull_request | not)' <<< "$issue" >/dev/null
          else
            jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null
          fi
          if [ "$REVOCATION_REQUESTED" != true ]; then
            jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null
            current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
            expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
            test "$current_body_sha" = "$expected_body_sha"
          fi
          if [ "$STANDARD_INSTALLATION_APPROVAL_REQUESTED" = true ]; then
            jq -e 'any(.labels[]?; .name == "standard-installation-approved")' <<< "$issue" >/dev/null
            latest_installation_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select(.event == "labeled" and .label.name == "standard-installation-approved")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_installation_transition="$(printf '%s\tlabeled\t%s\t%s' "$STANDARD_INSTALLATION_APPROVAL_EVENT_ID" "$MAINTAINER_REVIEWER" "$MAINTAINER_REVIEW_REQUESTED_AT")"
            test "$latest_installation_transition" = "$expected_installation_transition"
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Standard installation approval permission changed immediately before push." >&2; exit 1 ;;
            esac
          elif [ "$REVOCATION_REQUESTED" = true ]; then
            if jq -e 'any(.labels[]?; .name == "maintainer-verified")' <<< "$issue" >/dev/null; then
              echo "Maintainer verification label was reapplied before publication." >&2
              exit 1
            fi
            latest_revocation_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select(.event == "unlabeled" and .label.name == "maintainer-verified")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_revocation_transition="$(printf '%s\tunlabeled\t%s\t%s' "$REVOCATION_EVENT_ID" "$MAINTAINER_REVIEWER" "$REVOCATION_REQUESTED_AT")"
            test "$latest_revocation_transition" = "$expected_revocation_transition"
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Maintainer verification revocation permission changed immediately before push." >&2; exit 1 ;;
            esac
          elif [ "$MAINTAINER_REVIEW_REQUESTED" = true ]; then
            jq -e 'any(.labels[]?; .name == "maintainer-verified")' <<< "$issue" >/dev/null
            latest_review_transition="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
                | jq -r '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "maintainer-verified")] | sort_by(.created_at, .id) | last | [.id, .event, .actor.login, .created_at] | @tsv'
            )"
            expected_review_transition="$(printf '%s\tlabeled\t%s\t%s' "$MAINTAINER_REVIEW_EVENT_ID" "$MAINTAINER_REVIEWER" "$MAINTAINER_REVIEW_REQUESTED_AT")"
            test "$latest_review_transition" = "$expected_review_transition"
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${MAINTAINER_REVIEWER}/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Maintainer verification permission changed immediately before push." >&2; exit 1 ;;
            esac
          fi

          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${authorization}" \
            push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: >-
      (github.event.action != 'labeled' || github.run_attempt == 1) &&
      (needs.analyze.outputs.result == 'verified' || needs.analyze.outputs.result == 'revoked') &&
      needs.analyze.outputs.changed == 'true'
    needs: [analyze, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deployments
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify tested commit is still current
        env:
          EXPECTED_COMMIT: ${{ needs.publish.outputs.published_commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_main" ] || [ "$remote_main" != "$EXPECTED_COMMIT" ]; then
            echo "main changed before deployment; refusing to deploy an older verification artifact." >&2
            exit 1
          fi

      - name: Deploy tested verification Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.analyze.outputs.pages_artifact_name }}
          timeout: 300000

      - name: Confirm deployed catalog and Explorer data after Pages timeout
        if: steps.deployment.outcome == 'failure'
        env:
          EXPECTED_CATALOG_SHA: ${{ needs.analyze.outputs.catalog_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.analyze.outputs.explorer_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.analyze.outputs.deployment_id }}
        run: |
          set -euo pipefail
          live_catalog="$RUNNER_TEMP/live-catalog.json"
          live_explorer="$RUNNER_TEMP/live-explorer-data.json"
          live_deployment_id="$RUNNER_TEMP/live-deployment-id.txt"
          for (( attempt = 1; attempt <= 12; attempt++ )); do
            check_url="https://omarchyplugins.com/catalog.json?verification-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            explorer_url="https://omarchyplugins.com/explorer-data.json?verification-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            marker_url="https://omarchyplugins.com/deployment-id.txt?verification-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 10 \
              --output "$live_deployment_id" "$marker_url" \
              && curl --fail --silent --show-error --location --max-time 10 \
                --output "$live_catalog" "$check_url" \
              && curl --fail --silent --show-error --location --max-time 10 \
                --output "$live_explorer" "$explorer_url"; then
              read -r live_catalog_sha _ < <(sha256sum "$live_catalog")
              read -r live_explorer_sha _ < <(sha256sum "$live_explorer")
              live_id="$(tr -d '\r\n' < "$live_deployment_id")"
              if [[ $live_id == "$EXPECTED_DEPLOYMENT_ID" \
                && $live_catalog_sha == "$EXPECTED_CATALOG_SHA" \
                && $live_explorer_sha == "$EXPECTED_EXPLORER_SHA" ]]; then
                echo "The expected catalog and Explorer data are live despite the Pages action timeout."
                exit 0
              fi
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done
          echo "::error::Pages deployment failed and the expected catalog and Explorer data did not become live."
          exit 1

  report:
    if: >-
      always() &&
      (github.event.action != 'labeled' || github.run_attempt == 1) &&
      needs.analyze.result == 'success' &&
      (needs.analyze.outputs.changed != 'true' || needs.publish.result == 'success') &&
      (needs.analyze.outputs.changed != 'true' || needs.deploy.result == 'success')
    needs: [analyze, publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download verification report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.analyze.outputs.report_artifact_name }}
          path: ${{ runner.temp }}/plugin-verification-report

      - name: Verify verification report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/plugin-verification-report"
          if [ -n "$(find "$report" -type l -print -quit)" ]; then
            echo "Report contains an unexpected symbolic link." >&2
            exit 1
          fi
          actual_files="$(cd "$report" && find . -type f -printf '%P\n' | sort)"
          expected_files="$(printf '%s\n' SHA256SUMS verification-report.md verification-result.json | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Report contains unexpected files." >&2
            exit 1
          fi
          (cd "$report" && sha256sum --check SHA256SUMS)

      - name: Clear stale update request labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if [ "$REVOCATION_REQUESTED" = true ]; then
            jq -e '(.state == "open" or .state == "closed") and (.pull_request | not)' <<< "$issue" >/dev/null
          else
            jq -e --arg title "$EXPECTED_TITLE" --arg body "$EXPECTED_BODY" '.state == "open" and (.pull_request | not) and .title == $title and .body == $body' <<< "$issue" >/dev/null
          fi
          for label in plugin-update validated needs-fixes approved-and-verified security-needs-fixes security-review-required; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${label}" \
              >/dev/null 2>&1 || true
          done

      - name: Publish verification result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.analyze.outputs.result }}
          PLUGIN_ID: ${{ needs.analyze.outputs.plugin_id }}
          COMMIT_SHA: ${{ needs.analyze.outputs.commit_sha }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if [ "$REVOCATION_REQUESTED" != true ]; then
            if ! jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null; then
              echo "Verification issue title changed before reporting." >&2
              exit 1
            fi
            current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
            expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
            if [ "$current_body_sha" != "$expected_body_sha" ]; then
              echo "Verification issue body changed before reporting." >&2
              exit 1
            fi
          fi
          # A serialized issue event can remain queued after an earlier run
          # reports the same current verification and closes the issue.
          if [ "$RESULT" = "already-verified" ] \
            && jq -e '.state == "closed" and (.pull_request | not) and .state_reason == "completed" and .closed_by.login == "github-actions[bot]"' \
              <<< "$issue" >/dev/null; then
            verified_report_id="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
                | jq -r --arg plugin_id "$PLUGIN_ID" --arg commit "${COMMIT_SHA:0:7}" '
                    [.[][] | select(
                      .user.login == "github-actions[bot]"
                      and (.body | contains("<!-- marketplace-plugin-verification -->"))
                      and (.body | contains("✅ **Verified**"))
                      and (.body | contains("`" + $plugin_id + "`"))
                      and (.body | contains("`" + $commit + "…`"))
                    )]
                    | sort_by(.created_at, .id)
                    | last.id // empty
                  '
            )"
            if [[ $verified_report_id =~ ^[1-9][0-9]*$ ]]; then
              echo "Verification is already current and the issue was closed by an earlier completed run; skipping duplicate reporting."
              exit 0
            fi
            echo "Closed verification issue has no matching completed bot report." >&2
            exit 1
          fi
          if [ "$REVOCATION_REQUESTED" != true ] && ! jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null; then
            echo "Verification issue is no longer open." >&2
            exit 1
          fi

          status_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification-status -->"))) | .id'
          )"
          if ([ "$RESULT" = "already-verified" ] || [ "$RESULT" = "already-revoked" ]) && [ -n "$status_ids" ]; then
            echo "A prior verification workflow failure still requires maintainer review; preserving its status and leaving the issue open."
            exit 0
          fi

          report="$RUNNER_TEMP/plugin-verification-report/verification-report.md"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification -->"))) | .id' \
              | tail -n 1
          )"
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/plugin-verification-comment.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/plugin-verification-comment.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi

          while IFS= read -r status_id; do
            [ -z "$status_id" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${status_id}"
          done <<< "$status_ids"

          if [ "$RESULT" = verified ] || [ "$RESULT" = already-verified ] || [ "$RESULT" = revoked ] || [ "$RESULT" = already-revoked ]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

  report-failure:
    if: >-
      always() &&
      (needs.route.result == 'failure' || needs.route.result == 'cancelled' ||
       needs.analyze.result == 'failure' || needs.analyze.result == 'cancelled' ||
       needs.publish.result == 'failure' || needs.publish.result == 'cancelled' ||
       needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled' ||
       needs.report.result == 'failure' || needs.report.result == 'cancelled')
    needs: [route, analyze, publish, deploy, report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Confirm failed run still matches the issue
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          REVOCATION_REQUESTED: ${{ github.event.action == 'unlabeled' && github.event.label.name == 'maintainer-verified' }}
        run: |
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if jq -e --arg title "$EXPECTED_TITLE" --arg body "$EXPECTED_BODY" --argjson revocation "$REVOCATION_REQUESTED" '
            (($revocation and (.state == "open" or .state == "closed")) or (!$revocation and .state == "open"))
            and (.pull_request | not) and .title == $title and .body == $body
          ' <<< "$issue" >/dev/null; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "Issue changed after this run started; skipping stale failure reporting."
          fi

      - name: Report verification workflow failure
        if: steps.current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/plugin-verification-status.md"
          printf '<!-- marketplace-plugin-verification-status -->\n**Verification workflow failed.** The automated result was not published. A maintainer must review the workflow before retrying.\n\nWorkflow: %s\n' \
            "$RUN_URL" > "$status_file"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification-status -->"))) | .id' \
              | tail -n 1
          )"
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$status_file" > "$RUNNER_TEMP/plugin-verification-status.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/plugin-verification-status.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$status_file"
          fi
