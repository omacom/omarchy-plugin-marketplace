name: Validate plugin submission

on:
  workflow_call:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      (startsWith(github.event.issue.title, '[Plugin]:') || contains(github.event.issue.labels.*.name, 'submission')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'submission')
    concurrency:
      group: issue-validation-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      should_continue: ${{ steps.current.outputs.should_continue }}
      should_label: ${{ steps.intake.outputs.should_label }}
      should_validate: ${{ steps.intake.outputs.should_validate }}
      validation_result: ${{ steps.validation.outputs.result }}
      baseline_result: ${{ steps.baseline.outputs.result }}
      baseline_disposition: ${{ steps.baseline.outputs.disposition }}
      reports_artifact_name: ${{ steps.artifact-name.outputs.name }}
      failure_reason: ${{ steps.failure.outputs.reason }}
      failure_action: ${{ steps.failure.outputs.action }}
    steps:
      - name: Confirm submission is still open and unlisted
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if [ "$(jq -r '.state' <<<"$issue")" != "open" ] || \
             ! jq -e '(.pull_request | not)' <<<"$issue" >/dev/null || \
             jq -e '.labels | any(.name == "listed")' <<<"$issue" >/dev/null; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository without persisted credentials
        if: steps.current.outputs.should_continue == 'true'
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.current.outputs.should_continue == 'true'
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install validation dependencies
        if: steps.current.outputs.should_continue == 'true'
        id: dependencies
        run: npm ci

      - name: Classify submission
        if: steps.current.outputs.should_continue == 'true'
        id: intake
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: node scripts/intake-submission.mjs

      - name: Validate repository and manifests
        if: steps.current.outputs.should_continue == 'true' && steps.intake.outputs.should_validate == 'true'
        id: validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          VALIDATION_METADATA_PATH: validation-metadata.json
        run: |
          set +e
          node scripts/validate-submission.mjs > validation-report.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "result=validated" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo "result=needs-fixes" >> "$GITHUB_OUTPUT"
          else
            echo "Validation could not complete safely."
            exit "$status"
          fi

      - name: Run automated security baseline
        id: baseline
        if: steps.validation.outputs.result == 'validated'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/security-baseline.mjs \
            --metadata=validation-metadata.json \
            --json=security-baseline.json \
            > security-baseline-report.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            result="$(jq -r '.outcome' security-baseline.json)"
            disposition="$(jq -r '.verifiedPublicationDisposition' security-baseline.json)"
            case "$result" in
              passed|review-required|needs-fixes) ;;
              *) echo "Unexpected security baseline result: $result" >&2; exit 1 ;;
            esac
            case "$disposition" in
              clear|review-required|needs-fixes) ;;
              *) echo "Unexpected verified publication disposition: $disposition" >&2; exit 1 ;;
            esac
          elif [ "$status" -eq 3 ]; then
            test ! -e security-baseline.json
            IFS= read -r marker < security-baseline-report.md
            grep -Fqx '<!-- marketplace-security-baseline-error:v4 -->' <<< "$marker"
            result="scan-error"
            disposition=""
          else
            exit "$status"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"

      - name: Record validation report artifact identity
        id: artifact-name
        if: steps.current.outputs.should_continue == 'true' && steps.intake.outputs.should_validate == 'true'
        run: echo "name=validation-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Bundle analyzed validation reports
        id: bundle
        if: >-
          steps.current.outputs.should_continue == 'true' &&
          steps.intake.outputs.should_validate == 'true' &&
          steps.validation.outcome == 'success' &&
          steps.baseline.outcome != 'failure'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/validation-reports"
          mkdir -p "$bundle"
          cp validation-report.md "$bundle/validation-report.md"
          if [ -f security-baseline-report.md ]; then
            cp security-baseline-report.md "$bundle/security-baseline-report.md"
          fi
          (
            cd "$bundle"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload validation reports
        id: reports-artifact
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/validation-reports
          if-no-files-found: error
          retention-days: 1

      - name: Record validation workflow failure
        id: failure
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          INTAKE_OUTCOME: ${{ steps.intake.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          ARTIFACT_NAME_OUTCOME: ${{ steps.artifact-name.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          REPORTS_ARTIFACT_OUTCOME: ${{ steps.reports-artifact.outcome }}
        run: |
          action="A maintainer must review the workflow. Edit the issue after the workflow problem is fixed to retry validation."
          if [ "$CHECKOUT_OUTCOME" = failure ]; then
            reason="The marketplace source could not be checked out for validation."
          elif [ "$NODE_OUTCOME" = failure ]; then
            reason="The validation environment could not be configured."
          elif [ "$DEPENDENCIES_OUTCOME" = failure ]; then
            reason="Validation dependencies could not be installed."
          elif [ "$INTAKE_OUTCOME" = failure ]; then
            reason="The submission issue could not be classified."
          elif [ "$VALIDATION_OUTCOME" = failure ]; then
            reason="The repository validation process did not complete."
          elif [ "$BASELINE_OUTCOME" = failure ]; then
            reason="The automated security baseline did not complete."
          elif [ "$ARTIFACT_NAME_OUTCOME" = failure ]; then
            reason="The validation report artifact identity could not be created."
          elif [ "$BUNDLE_OUTCOME" = failure ] || [ "$REPORTS_ARTIFACT_OUTCOME" = failure ]; then
            reason="The validation reports could not be stored safely."
          else
            reason="The validation workflow did not complete."
          fi
          printf 'reason=%s\naction=%s\n' "$reason" "$action" >> "$GITHUB_OUTPUT"

  mutation-route:
    if: >-
      always() &&
      (needs.validate.result == 'failure' ||
       (needs.validate.result == 'success' && needs.validate.outputs.should_continue == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: read
    outputs:
      group: ${{ steps.route.outputs.group }}
    steps:
      - name: Select live validation mutation group
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ANALYSIS_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          global_group=plugin-catalog-writes
          if ! [[ $ISSUE_NUMBER =~ ^[1-9][0-9]*$ ]] || [ "$ANALYSIS_RESULT" != success ]; then
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_file="$RUNNER_TEMP/live-issue.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_file"; then
            echo "Issue state lookup failed; routing through the global mutation group."
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '
            type == "object"
            and (.state | type == "string")
            and (.title | type == "string")
            and ((.body | type) == "string" or (.body | type) == "null")
            and (.labels | type == "array")
            and (.labels | all(type == "object" and (.name | type == "string")))
            and ([.labels[].name] | length == (unique | length))
          ' "$issue_file" >/dev/null; then
            echo "Issue state was malformed; routing through the global mutation group."
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            def has_label($name): any(.labels[]; .name == $name);
            has_label("plugin-update")
            or has_label("approved-and-verified")
            or has_label("approved-for-listing")
            or has_label("maintainer-verified")
            or has_label("standard-installation-approved")
            or (has_label("validated") and has_label("needs-fixes"))
            or (has_label("needs-fixes") and
                (has_label("security-needs-fixes") or has_label("security-review-required")))
            or (has_label("security-needs-fixes") and has_label("security-review-required"))
            or ((has_label("security-needs-fixes") or has_label("security-review-required")) and
                (has_label("validated") | not))
          ' "$issue_file" >/dev/null; then
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
          else
            echo "group=issue-validation-${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    # Every admitted analysis generation is retained. The live route keeps
    # ordinary feedback per issue and sends approval-sensitive state through
    # the global writer. Later guards can request the same global fallback.
    if: >-
      always() &&
      (needs.validate.result == 'failure' ||
       (needs.validate.result == 'success' && needs.validate.outputs.should_continue == 'true'))
    needs: [validate, mutation-route]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ needs.mutation-route.outputs.group == format('issue-validation-{0}', github.event.issue.number) && format('issue-validation-{0}', github.event.issue.number) || 'plugin-catalog-writes' }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EXPECTED_TITLE: ${{ github.event.issue.title }}
      EXPECTED_BODY: ${{ github.event.issue.body }}
      EXPECTED_TYPE_LABEL: submission
      MUTATION_CONCURRENCY_GROUP: ${{ needs.mutation-route.outputs.group == format('issue-validation-{0}', github.event.issue.number) && format('issue-validation-{0}', github.event.issue.number) || 'plugin-catalog-writes' }}
    outputs:
      requires_global_fallback: ${{ steps.fallback.outputs.required }}
    steps: &submission-mutation-steps
      - name: Initialize live issue mutation guard
        id: initialize
        env:
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          EXPECTED_TYPE_LABEL: submission
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/guard-issue-mutation"
          helpers="$RUNNER_TEMP/issue-mutation-helpers"
          cat > "$guard" <<'GUARD'
          #!/usr/bin/env bash
          set -euo pipefail
          mode="${1:-general}"
          case "$mode" in general|trust|postflight) ;; *) printf '%s\n' error; exit 0 ;; esac
          global_group=plugin-catalog-writes
          stop_file="$RUNNER_TEMP/issue-mutation-stop"
          mutated_file="$RUNNER_TEMP/issue-mutation-performed"
          issue_file="$RUNNER_TEMP/live-issue.json"

          if [ -f "$stop_file" ]; then
            cat "$stop_file"
            exit 0
          fi
          uncertain() {
            if [ "$MUTATION_CONCURRENCY_GROUP" = "$global_group" ]; then
              printf '%s\n' error
            else
              printf '%s\n' fallback | tee "$stop_file"
            fi
          }
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_file"; then
            uncertain
            exit 0
          fi
          if ! jq -e '
            type == "object"
            and (.state | type == "string")
            and (.title | type == "string")
            and ((.body | type) == "string" or (.body | type) == "null")
            and (has("pull_request") | not)
            and (.labels | type == "array")
            and (.labels | all(type == "object" and (.name | type == "string")))
            and ([.labels[].name] | length == (unique | length))
          ' "$issue_file" >/dev/null; then
            uncertain
            exit 0
          fi
          if ! jq -e --arg title "$EXPECTED_TITLE" --arg body "$EXPECTED_BODY" '
            .state == "open"
            and .title == $title
            and (.body // "") == $body
            and (.labels | all(.name != "listed"))
            and ((.title | startswith("[Plugin]:")) or (.labels | any(.name == "submission")))
          ' "$issue_file" >/dev/null; then
            if [ -f "$mutated_file" ] && [ "$MUTATION_CONCURRENCY_GROUP" != "$global_group" ]; then
              printf '%s\n' fallback | tee "$stop_file"
            else
              printf '%s\n' stale | tee "$stop_file"
            fi
            exit 0
          fi
          if [ "$mode" = trust ] && ! jq -e --arg label "$EXPECTED_TYPE_LABEL" '
            (.labels | any(.name == $label))
            and (.labels | all(.name != "plugin-update"))
          ' "$issue_file" >/dev/null; then
            uncertain
            exit 0
          fi
          if [ "$MUTATION_CONCURRENCY_GROUP" != "$global_group" ] && jq -e '
            def has_label($name): any(.labels[]; .name == $name);
            has_label("plugin-update")
            or has_label("approved-and-verified")
            or has_label("approved-for-listing")
            or has_label("maintainer-verified")
            or has_label("standard-installation-approved")
            or (has_label("validated") and has_label("needs-fixes"))
            or (has_label("needs-fixes") and
                (has_label("security-needs-fixes") or has_label("security-review-required")))
            or (has_label("security-needs-fixes") and has_label("security-review-required"))
            or ((has_label("security-needs-fixes") or has_label("security-review-required")) and
                (has_label("validated") | not))
          ' "$issue_file" >/dev/null; then
            printf '%s\n' fallback | tee "$stop_file"
            exit 0
          fi
          printf '%s\n' safe
          GUARD
          cat > "$helpers" <<'HELPERS'
          set -E
          route_issue_mutation_error() {
            status=$?
            trap - ERR
            if [ "$MUTATION_CONCURRENCY_GROUP" != plugin-catalog-writes ]; then
              printf '%s\n' fallback > "$RUNNER_TEMP/issue-mutation-stop"
              echo "Deferring incomplete issue mutation to the global fallback."
              exit 0
            fi
            exit "$status"
          }
          trap route_issue_mutation_error ERR
          require_issue_mutation() {
            decision="$("$RUNNER_TEMP/guard-issue-mutation" "${1:-general}")"
            case "$decision" in
              safe) ;;
              fallback|stale) exit 0 ;;
              *) return 1 ;;
            esac
          }
          mark_issue_mutation() {
            : > "$RUNNER_TEMP/issue-mutation-performed"
          }
          remove_issue_label() {
            label="$1"
            guard_mode="${2:-trust}"
            require_issue_mutation "$guard_mode"
            if jq -e --arg label "$label" '.labels | any(.name == $label)' \
              "$RUNNER_TEMP/live-issue.json" >/dev/null; then
              if ! gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${label}" >/dev/null 2>&1; then
                rm -f "$RUNNER_TEMP/issue-mutation-stop"
                decision="$("$RUNNER_TEMP/guard-issue-mutation" "$guard_mode")"
                if [ "$decision" != safe ] || jq -e --arg label "$label" \
                  '.labels | any(.name == $label)' "$RUNNER_TEMP/live-issue.json" >/dev/null; then
                  return 1
                fi
              fi
              mark_issue_mutation
            fi
          }
          HELPERS
          chmod 700 "$guard" "$helpers"

      - name: Confirm analyzed issue state is still current
        id: current
        if: needs.validate.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          decision="$("$RUNNER_TEMP/guard-issue-mutation" general)"
          case "$decision" in
            safe) echo "should_publish=true" >> "$GITHUB_OUTPUT" ;;
            fallback|stale) echo "should_publish=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Add submission label
        id: submission-label
        if: steps.current.outputs.should_publish == 'true' && needs.validate.outputs.should_label == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation general
          gh issue edit "$ISSUE_NUMBER" --add-label submission
          mark_issue_mutation

      - name: Download analyzed validation reports
        id: download
        if: steps.current.outputs.should_publish == 'true' && needs.validate.outputs.should_validate == 'true'
        continue-on-error: ${{ env.MUTATION_CONCURRENCY_GROUP != 'plugin-catalog-writes' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate.outputs.reports_artifact_name }}
          path: ${{ runner.temp }}/validation-reports

      - name: Verify analyzed validation reports
        id: reports
        if: >-
          steps.current.outputs.should_publish == 'true' &&
          needs.validate.outputs.should_validate == 'true' &&
          steps.download.outcome == 'success'
        continue-on-error: ${{ env.MUTATION_CONCURRENCY_GROUP != 'plugin-catalog-writes' }}
        env:
          VALIDATION_RESULT: ${{ needs.validate.outputs.validation_result }}
          BASELINE_RESULT: ${{ needs.validate.outputs.baseline_result }}
          BASELINE_DISPOSITION: ${{ needs.validate.outputs.baseline_disposition }}
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/validation-reports"
          if [ -n "$(find "$reports" -type l -print -quit)" ]; then
            echo "Validation report artifact contains a symbolic link." >&2
            exit 1
          fi
          actual_files="$(cd "$reports" && find . -type f -printf '%P\n' | sort)"
          if [ "$VALIDATION_RESULT" = validated ]; then
            case "$BASELINE_RESULT" in
              passed|review-required|needs-fixes)
                case "$BASELINE_DISPOSITION" in
                  clear|review-required|needs-fixes) ;;
                  *) echo "Validated baseline disposition is invalid." >&2; exit 1 ;;
                esac
                marker_pattern='^<!-- marketplace-security-baseline:v4 [A-Za-z0-9_-]+ -->$'
                ;;
              scan-error)
                test -z "$BASELINE_DISPOSITION"
                marker_pattern='^<!-- marketplace-security-baseline-error:v4 -->$'
                ;;
              *) echo "Validated baseline result is invalid." >&2; exit 1 ;;
            esac
            expected_files="$(printf '%s\n' SHA256SUMS security-baseline-report.md validation-report.md | sort)"
            IFS= read -r marker < "$reports/security-baseline-report.md"
            grep -Eq "$marker_pattern" <<< "$marker"
          elif [ "$VALIDATION_RESULT" = needs-fixes ]; then
            test -z "$BASELINE_RESULT"
            test -z "$BASELINE_DISPOSITION"
            expected_files="$(printf '%s\n' SHA256SUMS validation-report.md | sort)"
          else
            echo "Validation result is invalid." >&2
            exit 1
          fi
          test "$actual_files" = "$expected_files"
          (cd "$reports" && sha256sum --check SHA256SUMS)

      - name: Publish validation report
        id: report
        if: >-
          steps.current.outputs.should_publish == 'true' &&
          needs.validate.outputs.should_validate == 'true' &&
          steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation trust
          report="$RUNNER_TEMP/validation-reports/validation-report.md"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-validation -->"))) | .id' \
              | tail -n 1
          )"
          require_issue_mutation trust
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/validation-comment.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/validation-comment.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi
          mark_issue_mutation

      - name: Publish automated security baseline
        id: baseline-report
        if: >-
          steps.current.outputs.should_publish == 'true' &&
          needs.validate.outputs.validation_result == 'validated' &&
          steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation trust
          report="$RUNNER_TEMP/validation-reports/security-baseline-report.md"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body | test("<!-- marketplace-security-baseline:v[0-9]+ ")) or (.body | test("<!-- marketplace-security-baseline-error:v[0-9]+ -->")))) | .id' \
              | tail -n 1
          )"
          require_issue_mutation trust
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/security-baseline-comment.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/security-baseline-comment.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi
          mark_issue_mutation

      - name: Update validation labels
        id: labels
        if: >-
          steps.current.outputs.should_publish == 'true' &&
          needs.validate.outputs.should_validate == 'true' &&
          steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.validate.outputs.validation_result }}
          BASELINE_RESULT: ${{ needs.validate.outputs.baseline_result }}
          BASELINE_DISPOSITION: ${{ needs.validate.outputs.baseline_disposition }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          add_label() {
            require_issue_mutation trust
            gh issue edit "$ISSUE_NUMBER" --add-label "$1"
            mark_issue_mutation
          }

          # Any fresh validation invalidates an earlier human decision. A live
          # decision discovered on the per-issue path is never removed there;
          # it moves the exact artifact to the globally locked fallback.
          remove_issue_label approved-and-verified
          remove_issue_label approved-for-listing

          if [ "$RESULT" = "validated" ] && [ "$BASELINE_RESULT" = "scan-error" ]; then
            test -z "$BASELINE_DISPOSITION"
            add_label needs-fixes
            remove_issue_label validated
            remove_issue_label security-needs-fixes
            remove_issue_label security-review-required
          elif [ "$RESULT" = "validated" ]; then
            case "$BASELINE_RESULT" in
              passed|review-required|needs-fixes) ;;
              *) echo "A validated submission requires a complete security baseline." >&2; exit 1 ;;
            esac
            add_label validated
            remove_issue_label needs-fixes
            case "$BASELINE_DISPOSITION" in
              clear)
                remove_issue_label security-needs-fixes
                remove_issue_label security-review-required
                ;;
              review-required)
                add_label security-review-required
                remove_issue_label security-needs-fixes
                ;;
              needs-fixes)
                add_label security-needs-fixes
                remove_issue_label security-review-required
                ;;
              *)
                echo "A validated submission requires a security label disposition." >&2
                exit 1
                ;;
            esac
          elif [ "$RESULT" = "needs-fixes" ]; then
            test -z "$BASELINE_RESULT"
            test -z "$BASELINE_DISPOSITION"
            add_label needs-fixes
            remove_issue_label validated
            remove_issue_label security-needs-fixes
            remove_issue_label security-review-required
          else
            echo "Validation result is invalid." >&2
            exit 1
          fi

      - name: Recheck issue trust state after validation mutations
        id: postflight
        if: steps.current.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          decision="$("$RUNNER_TEMP/guard-issue-mutation" postflight)"
          case "$decision" in
            safe|fallback|stale) ;;
            *) exit 1 ;;
          esac

      - name: Record validation publication failure
        id: failure
        if: >-
          always() &&
          needs.validate.result == 'success' &&
          (steps.initialize.outcome == 'failure' ||
           steps.current.outcome == 'failure' ||
           steps.submission-label.outcome == 'failure' ||
           steps.download.outcome == 'failure' ||
           steps.reports.outcome == 'failure' ||
           steps.report.outcome == 'failure' ||
           steps.baseline-report.outcome == 'failure' ||
           steps.labels.outcome == 'failure' ||
           steps.postflight.outcome == 'failure')
        env:
          CURRENT_OUTCOME: ${{ steps.current.outcome }}
          SUBMISSION_LABEL_OUTCOME: ${{ steps.submission-label.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          BASELINE_REPORT_OUTCOME: ${{ steps.baseline-report.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
        run: |
          action="A maintainer must review the workflow. Edit the issue after the workflow problem is fixed to retry validation."
          if [ "$CURRENT_OUTCOME" = failure ]; then
            reason="The current submission state could not be confirmed."
          elif [ "$SUBMISSION_LABEL_OUTCOME" = failure ]; then
            reason="The submission label could not be applied."
          elif [ "$DOWNLOAD_OUTCOME" = failure ]; then
            reason="The analyzed validation reports could not be retrieved."
          elif [ "$REPORTS_OUTCOME" = failure ]; then
            reason="The analyzed validation reports failed integrity checks."
          elif [ "$REPORT_OUTCOME" = failure ]; then
            reason="The validation result could not be published to the issue."
          elif [ "$BASELINE_REPORT_OUTCOME" = failure ]; then
            reason="The automated security baseline result could not be published to the issue."
          elif [ "$LABELS_OUTCOME" = failure ]; then
            reason="The validation status labels could not be updated."
          else
            reason="The validation publication workflow did not complete."
          fi
          printf 'reason=%s\naction=%s\n' "$reason" "$action" >> "$GITHUB_OUTPUT"

      - name: Confirm failed run still matches the submission
        id: failure-current
        if: >-
          always() &&
          (needs.validate.result == 'failure' || steps.failure.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if jq -e --arg title "$EXPECTED_TITLE" --arg body "$EXPECTED_BODY" '
            .state == "open"
            and (.pull_request | not)
            and ((.title | startswith("[Plugin]:")) or (.labels | any(.name == "submission")))
            and (.labels | all(.name != "listed"))
            and .title == $title
            and .body == $body
          ' <<< "$issue" >/dev/null; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "Submission changed after this run started; skipping stale failure mutations."
          fi

      - name: Clear stale approval state after workflow failure
        if: >-
          always() &&
          env.MUTATION_CONCURRENCY_GROUP == 'plugin-catalog-writes' &&
          (needs.validate.result == 'failure' || steps.failure.outcome == 'success') &&
          steps.failure-current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          for label in validated approved-and-verified approved-for-listing security-needs-fixes security-review-required; do
            remove_issue_label "$label" general
          done

      - name: Report validation workflow failure
        if: >-
          always() &&
          env.MUTATION_CONCURRENCY_GROUP == 'plugin-catalog-writes' &&
          (needs.validate.result == 'failure' || steps.failure.outcome == 'success') &&
          steps.failure-current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_REASON: ${{ steps.failure.outputs.reason || needs.validate.outputs.failure_reason }}
          FAILURE_ACTION: ${{ steps.failure.outputs.action || needs.validate.outputs.failure_action }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation general
          reason="${FAILURE_REASON:-The validation workflow did not complete.}"
          action="${FAILURE_ACTION:-A maintainer must review the workflow before validation is retried.}"
          report_file="$RUNNER_TEMP/validation-report.md"
          printf '<!-- marketplace-validation -->\n## Marketplace validation\n\n❌ **Validation failed:** %s\n\n%s\n\nWorkflow: %s\n' \
            "$reason" "$action" "$RUN_URL" > "$report_file"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-validation -->"))) | .id' \
              | tail -n 1
          )"
          require_issue_mutation general
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report_file" > "$RUNNER_TEMP/validation-report.json"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/validation-report.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report_file"
          fi
          mark_issue_mutation

      - name: Route incomplete validation mutation through the global fallback
        id: fallback
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          BASELINE_REPORT_OUTCOME: ${{ steps.baseline-report.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          required=false
          if [ "$MUTATION_CONCURRENCY_GROUP" != plugin-catalog-writes ]; then
            if [ -f "$RUNNER_TEMP/issue-mutation-stop" ] && \
               [ "$(cat "$RUNNER_TEMP/issue-mutation-stop")" = fallback ]; then
              required=true
            fi
            for outcome in "$INITIALIZE_OUTCOME" "$DOWNLOAD_OUTCOME" "$REPORTS_OUTCOME" \
              "$REPORT_OUTCOME" "$BASELINE_REPORT_OUTCOME" "$LABELS_OUTCOME" \
              "$POSTFLIGHT_OUTCOME"; do
              if [ "$outcome" = failure ]; then
                required=true
              fi
            done
            if [ "$JOB_STATUS" = failure ]; then
              required=true
            fi
          fi
          echo "required=${required}" >> "$GITHUB_OUTPUT"

  publish-fallback:
    if: >-
      always() &&
      (needs.publish.outputs.requires_global_fallback == 'true' ||
       (needs.publish.result == 'failure' &&
        needs.mutation-route.outputs.group == format('issue-validation-{0}', github.event.issue.number)))
    needs: [validate, mutation-route, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: plugin-catalog-writes
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EXPECTED_TITLE: ${{ github.event.issue.title }}
      EXPECTED_BODY: ${{ github.event.issue.body }}
      EXPECTED_TYPE_LABEL: submission
      MUTATION_CONCURRENCY_GROUP: plugin-catalog-writes
    steps: *submission-mutation-steps
