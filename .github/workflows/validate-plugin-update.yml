name: Validate plugin update

on:
  workflow_call:

permissions:
  contents: read
  issues: read

jobs:
  route:
    if: >-
      startsWith(github.event.issue.title, '[Verify]:') &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: none
    outputs:
      action: ${{ steps.route.outputs.action }}
    steps:
      - name: Route exact verification action
        id: route
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const body = process.env.ISSUE_BODY || "";
          const match = body.match(/^### Verification action\s*\r?\n\r?\n([^\r\n]+)\s*$/m);
          const action = match?.[1]?.trim() === "Verify and publish a newer upstream commit"
            ? "update"
            : "listed";
          appendFileSync(process.env.GITHUB_OUTPUT, `action=${action}\n`);
          NODE

  analyze:
    if: needs.route.outputs.action == 'update'
    needs: route
    concurrency:
      group: issue-validation-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      validation_result: ${{ steps.validation.outputs.result }}
      baseline_result: ${{ steps.baseline.outputs.result }}
      baseline_disposition: ${{ steps.baseline.outputs.disposition }}
      reports_artifact_name: ${{ steps.identity.outputs.name }}
      failure_reason: ${{ steps.failure.outputs.reason }}
    steps:
      - name: Check out main without persisted credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install validation dependencies
        id: dependencies
        run: npm ci

      - name: Validate exact plugin update
        id: validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          VALIDATION_METADATA_PATH: update-validation-metadata.json
        run: |
          set +e
          node scripts/validate-plugin-update.mjs > update-validation-report.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "result=validated" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo "result=needs-fixes" >> "$GITHUB_OUTPUT"
          else
            echo "Plugin update validation could not complete safely." >&2
            exit "$status"
          fi

      - name: Run automated security baseline
        id: baseline
        if: steps.validation.outputs.result == 'validated'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/security-baseline.mjs \
            --metadata=update-validation-metadata.json \
            --json=update-security-baseline.json \
            > update-security-baseline-report.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            result="$(jq -r '.outcome' update-security-baseline.json)"
            disposition="$(jq -r '.verifiedPublicationDisposition' update-security-baseline.json)"
            case "$result" in
              passed|review-required|needs-fixes) ;;
              *) echo "Unexpected security baseline result: $result" >&2; exit 1 ;;
            esac
            case "$disposition" in
              clear|review-required|needs-fixes) ;;
              *) echo "Unexpected verified publication disposition: $disposition" >&2; exit 1 ;;
            esac
          elif [ "$status" -eq 3 ]; then
            test ! -e update-security-baseline.json
            IFS= read -r marker < update-security-baseline-report.md
            grep -Fqx '<!-- marketplace-security-baseline-error:v4 -->' <<< "$marker"
            result="scan-error"
            disposition=""
          else
            exit "$status"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"

      - name: Record immutable report identity
        id: identity
        if: steps.validation.outcome == 'success' && steps.baseline.outcome != 'failure'
        run: echo "name=plugin-update-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Bundle analyzed update reports
        id: bundle
        if: steps.validation.outcome == 'success' && steps.baseline.outcome != 'failure'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/plugin-update-reports"
          mkdir -p "$bundle"
          cp update-validation-report.md "$bundle/update-validation-report.md"
          if [ -f update-security-baseline-report.md ]; then
            cp update-security-baseline-report.md "$bundle/update-security-baseline-report.md"
          fi
          (
            cd "$bundle"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload analyzed update reports
        id: upload
        if: steps.validation.outcome == 'success' && steps.baseline.outcome != 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ runner.temp }}/plugin-update-reports
          if-no-files-found: error
          retention-days: 1

      - name: Record update validation failure
        id: failure
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$CHECKOUT_OUTCOME" = failure ]; then
            reason="The marketplace source could not be checked out for update validation."
          elif [ "$NODE_OUTCOME" = failure ]; then
            reason="The update validation environment could not be configured."
          elif [ "$DEPENDENCIES_OUTCOME" = failure ]; then
            reason="Update validation dependencies could not be installed."
          elif [ "$VALIDATION_OUTCOME" = failure ]; then
            reason="The plugin update compatibility validation did not complete."
          elif [ "$BASELINE_OUTCOME" = failure ]; then
            reason="The update security baseline did not complete."
          elif [ "$BUNDLE_OUTCOME" = failure ] || [ "$UPLOAD_OUTCOME" = failure ]; then
            reason="The analyzed update reports could not be stored safely."
          else
            reason="The plugin update validation workflow did not complete."
          fi
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

  mutation-route:
    if: >-
      always() &&
      (needs.route.result == 'failure' ||
       needs.analyze.result == 'failure' ||
       needs.analyze.result == 'success')
    needs: [route, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: read
    outputs:
      group: ${{ steps.route.outputs.group }}
    steps:
      - name: Select live update mutation group
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ROUTE_RESULT: ${{ needs.route.result }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          global_group=plugin-catalog-writes
          if ! [[ $ISSUE_NUMBER =~ ^[1-9][0-9]*$ ]] || \
             [ "$ROUTE_RESULT" = failure ] || [ "$ANALYSIS_RESULT" != success ]; then
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_file="$RUNNER_TEMP/live-issue.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_file"; then
            echo "Issue state lookup failed; routing through the global mutation group."
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '
            type == "object"
            and (.state | type == "string")
            and (.title | type == "string")
            and ((.body | type) == "string" or (.body | type) == "null")
            and (.labels | type == "array")
            and (.labels | all(type == "object" and (.name | type == "string")))
            and ([.labels[].name] | length == (unique | length))
          ' "$issue_file" >/dev/null; then
            echo "Issue state was malformed; routing through the global mutation group."
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            def has_label($name): any(.labels[]; .name == $name);
            has_label("submission")
            or has_label("approved-and-verified")
            or has_label("approved-for-listing")
            or has_label("maintainer-verified")
            or has_label("standard-installation-approved")
            or (has_label("validated") and has_label("needs-fixes"))
            or (has_label("needs-fixes") and
                (has_label("security-needs-fixes") or has_label("security-review-required")))
            or (has_label("security-needs-fixes") and has_label("security-review-required"))
            or ((has_label("security-needs-fixes") or has_label("security-review-required")) and
                (has_label("validated") | not))
          ' "$issue_file" >/dev/null; then
            echo "group=${global_group}" >> "$GITHUB_OUTPUT"
          else
            echo "group=issue-validation-${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    # Every admitted analysis generation is retained. The live route keeps
    # ordinary feedback per issue and sends approval-sensitive state through
    # the global writer. Later guards can request the same global fallback.
    if: >-
      always() &&
      (needs.route.result == 'failure' ||
       needs.analyze.result == 'failure' ||
       needs.analyze.result == 'success')
    needs: [route, analyze, mutation-route]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ needs.mutation-route.outputs.group == format('issue-validation-{0}', github.event.issue.number) && format('issue-validation-{0}', github.event.issue.number) || 'plugin-catalog-writes' }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EXPECTED_TITLE: ${{ github.event.issue.title }}
      EXPECTED_BODY: ${{ github.event.issue.body }}
      EXPECTED_TYPE_LABEL: plugin-update
      MUTATION_CONCURRENCY_GROUP: ${{ needs.mutation-route.outputs.group == format('issue-validation-{0}', github.event.issue.number) && format('issue-validation-{0}', github.event.issue.number) || 'plugin-catalog-writes' }}
    outputs:
      requires_global_fallback: ${{ steps.fallback.outputs.required }}
    steps: &update-mutation-steps
      - name: Initialize live issue mutation guard
        id: initialize
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/guard-issue-mutation"
          helpers="$RUNNER_TEMP/issue-mutation-helpers"
          cat > "$guard" <<'GUARD'
          #!/usr/bin/env bash
          set -euo pipefail
          mode="${1:-general}"
          case "$mode" in general|trust|postflight) ;; *) printf '%s\n' error; exit 0 ;; esac
          global_group=plugin-catalog-writes
          stop_file="$RUNNER_TEMP/issue-mutation-stop"
          mutated_file="$RUNNER_TEMP/issue-mutation-performed"
          issue_file="$RUNNER_TEMP/live-issue.json"

          if [ -f "$stop_file" ]; then
            cat "$stop_file"
            exit 0
          fi
          uncertain() {
            if [ "$MUTATION_CONCURRENCY_GROUP" = "$global_group" ]; then
              printf '%s\n' error
            else
              printf '%s\n' fallback | tee "$stop_file"
            fi
          }
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_file"; then
            uncertain
            exit 0
          fi
          if ! jq -e '
            type == "object"
            and (.state | type == "string")
            and (.title | type == "string")
            and ((.body | type) == "string" or (.body | type) == "null")
            and (has("pull_request") | not)
            and (.labels | type == "array")
            and (.labels | all(type == "object" and (.name | type == "string")))
            and ([.labels[].name] | length == (unique | length))
          ' "$issue_file" >/dev/null; then
            uncertain
            exit 0
          fi
          if ! jq -e --arg title "$EXPECTED_TITLE" --arg body "$EXPECTED_BODY" '
            .state == "open"
            and .title == $title
            and (.body // "") == $body
            and (.title | startswith("[Verify]:"))
          ' "$issue_file" >/dev/null; then
            if [ -f "$mutated_file" ] && [ "$MUTATION_CONCURRENCY_GROUP" != "$global_group" ]; then
              printf '%s\n' fallback | tee "$stop_file"
            else
              printf '%s\n' stale | tee "$stop_file"
            fi
            exit 0
          fi
          if [ "$mode" = trust ] && ! jq -e --arg label "$EXPECTED_TYPE_LABEL" '
            (.labels | any(.name == $label))
            and (.labels | all(.name != "submission"))
          ' "$issue_file" >/dev/null; then
            uncertain
            exit 0
          fi
          if [ "$MUTATION_CONCURRENCY_GROUP" != "$global_group" ] && jq -e '
            def has_label($name): any(.labels[]; .name == $name);
            has_label("submission")
            or has_label("approved-and-verified")
            or has_label("approved-for-listing")
            or has_label("maintainer-verified")
            or has_label("standard-installation-approved")
            or (has_label("validated") and has_label("needs-fixes"))
            or (has_label("needs-fixes") and
                (has_label("security-needs-fixes") or has_label("security-review-required")))
            or (has_label("security-needs-fixes") and has_label("security-review-required"))
            or ((has_label("security-needs-fixes") or has_label("security-review-required")) and
                (has_label("validated") | not))
          ' "$issue_file" >/dev/null; then
            printf '%s\n' fallback | tee "$stop_file"
            exit 0
          fi
          printf '%s\n' safe
          GUARD
          cat > "$helpers" <<'HELPERS'
          set -E
          route_issue_mutation_error() {
            status=$?
            trap - ERR
            if [ "$MUTATION_CONCURRENCY_GROUP" != plugin-catalog-writes ]; then
              printf '%s\n' fallback > "$RUNNER_TEMP/issue-mutation-stop"
              echo "Deferring incomplete issue mutation to the global fallback."
              exit 0
            fi
            exit "$status"
          }
          trap route_issue_mutation_error ERR
          require_issue_mutation() {
            decision="$("$RUNNER_TEMP/guard-issue-mutation" "${1:-general}")"
            case "$decision" in
              safe) ;;
              fallback|stale) exit 0 ;;
              *) return 1 ;;
            esac
          }
          mark_issue_mutation() {
            : > "$RUNNER_TEMP/issue-mutation-performed"
          }
          remove_issue_label() {
            label="$1"
            guard_mode="${2:-trust}"
            require_issue_mutation "$guard_mode"
            if jq -e --arg label "$label" '.labels | any(.name == $label)' \
              "$RUNNER_TEMP/live-issue.json" >/dev/null; then
              if ! gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${label}" >/dev/null 2>&1; then
                rm -f "$RUNNER_TEMP/issue-mutation-stop"
                decision="$("$RUNNER_TEMP/guard-issue-mutation" "$guard_mode")"
                if [ "$decision" != safe ] || jq -e --arg label "$label" \
                  '.labels | any(.name == $label)' "$RUNNER_TEMP/live-issue.json" >/dev/null; then
                  return 1
                fi
              fi
              mark_issue_mutation
            fi
          }
          HELPERS
          chmod 700 "$guard" "$helpers"

      - name: Confirm update issue is still current
        id: current
        if: needs.analyze.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          decision="$("$RUNNER_TEMP/guard-issue-mutation" general)"
          case "$decision" in
            safe|fallback|stale) ;;
            *) exit 1 ;;
          esac

      - name: Download analyzed update reports
        id: download
        if: needs.analyze.result == 'success'
        continue-on-error: ${{ env.MUTATION_CONCURRENCY_GROUP != 'plugin-catalog-writes' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.analyze.outputs.reports_artifact_name }}
          path: ${{ runner.temp }}/plugin-update-reports

      - name: Verify analyzed update reports
        id: reports
        if: needs.analyze.result == 'success' && steps.download.outcome == 'success'
        continue-on-error: ${{ env.MUTATION_CONCURRENCY_GROUP != 'plugin-catalog-writes' }}
        env:
          VALIDATION_RESULT: ${{ needs.analyze.outputs.validation_result }}
          BASELINE_RESULT: ${{ needs.analyze.outputs.baseline_result }}
          BASELINE_DISPOSITION: ${{ needs.analyze.outputs.baseline_disposition }}
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/plugin-update-reports"
          if [ -n "$(find "$reports" -type l -print -quit)" ]; then
            echo "Update report artifact contains a symbolic link." >&2
            exit 1
          fi
          actual_files="$(cd "$reports" && find . -type f -printf '%P\n' | sort)"
          if [ "$VALIDATION_RESULT" = validated ]; then
            case "$BASELINE_RESULT" in
              passed|review-required|needs-fixes)
                case "$BASELINE_DISPOSITION" in
                  clear|review-required|needs-fixes) ;;
                  *) echo "Validated baseline disposition is invalid." >&2; exit 1 ;;
                esac
                marker_pattern='^<!-- marketplace-security-baseline:v4 [A-Za-z0-9_-]+ -->$'
                ;;
              scan-error)
                test -z "$BASELINE_DISPOSITION"
                marker_pattern='^<!-- marketplace-security-baseline-error:v4 -->$'
                ;;
              *) echo "Validated baseline result is invalid." >&2; exit 1 ;;
            esac
            expected_files="$(printf '%s\n' SHA256SUMS update-security-baseline-report.md update-validation-report.md | sort)"
            IFS= read -r marker < "$reports/update-security-baseline-report.md"
            grep -Eq "$marker_pattern" <<< "$marker"
          elif [ "$VALIDATION_RESULT" = needs-fixes ]; then
            test -z "$BASELINE_RESULT"
            test -z "$BASELINE_DISPOSITION"
            expected_files="$(printf '%s\n' SHA256SUMS update-validation-report.md | sort)"
          else
            echo "Update validation result is invalid." >&2
            exit 1
          fi
          test "$actual_files" = "$expected_files"
          (cd "$reports" && sha256sum --check SHA256SUMS)

      - name: Ensure plugin update type label
        id: type-label
        if: needs.analyze.result == 'success' && steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation general
          if ! jq -e '.labels | any(.name == "plugin-update")' \
            "$RUNNER_TEMP/live-issue.json" >/dev/null; then
            gh issue edit "$ISSUE_NUMBER" --add-label plugin-update
            mark_issue_mutation
          fi

      - name: Publish update validation report
        id: validation-report
        if: needs.analyze.result == 'success' && steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation trust
          report="$RUNNER_TEMP/plugin-update-reports/update-validation-report.md"
          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-update-validation -->"))) | .id' \
              | tail -n 1
          )"
          require_issue_mutation trust
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/update-validation-comment.json"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/update-validation-comment.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi
          mark_issue_mutation

      - name: Publish update security baseline
        id: baseline-report
        if: >-
          needs.analyze.result == 'success' &&
          needs.analyze.outputs.validation_result == 'validated' &&
          steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation trust
          report="$RUNNER_TEMP/plugin-update-reports/update-security-baseline-report.md"
          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body | test("<!-- marketplace-security-baseline:v[0-9]+ ")) or (.body | test("<!-- marketplace-security-baseline-error:v[0-9]+ -->")))) | .id' \
              | tail -n 1
          )"
          require_issue_mutation trust
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/update-baseline-comment.json"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/update-baseline-comment.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi
          mark_issue_mutation

      - name: Update plugin update labels
        id: labels
        if: needs.analyze.result == 'success' && steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
          RESULT: ${{ needs.analyze.outputs.validation_result }}
          BASELINE_RESULT: ${{ needs.analyze.outputs.baseline_result }}
          BASELINE_DISPOSITION: ${{ needs.analyze.outputs.baseline_disposition }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          add_label() {
            guard_mode="${2:-trust}"
            require_issue_mutation "$guard_mode"
            gh issue edit "$ISSUE_NUMBER" --add-label "$1"
            mark_issue_mutation
          }

          remove_issue_label approved-and-verified
          remove_issue_label approved-for-listing
          remove_issue_label maintainer-verified
          if [ "$RESULT" = validated ] && [ "$BASELINE_RESULT" = scan-error ]; then
            test -z "$BASELINE_DISPOSITION"
            add_label needs-fixes
            remove_issue_label validated
            remove_issue_label security-needs-fixes
            remove_issue_label security-review-required
          elif [ "$RESULT" = validated ]; then
            case "$BASELINE_RESULT" in
              passed|review-required|needs-fixes) ;;
              *) echo "A validated update requires a complete security baseline." >&2; exit 1 ;;
            esac
            add_label validated
            remove_issue_label needs-fixes
            case "$BASELINE_DISPOSITION" in
              clear)
                remove_issue_label security-needs-fixes
                remove_issue_label security-review-required
                ;;
              review-required)
                add_label security-review-required
                remove_issue_label security-needs-fixes
                ;;
              needs-fixes)
                add_label security-needs-fixes
                remove_issue_label security-review-required
                ;;
              *) echo "A validated update requires a security disposition." >&2; exit 1 ;;
            esac
          elif [ "$RESULT" = needs-fixes ]; then
            test -z "$BASELINE_RESULT"
            test -z "$BASELINE_DISPOSITION"
            add_label needs-fixes
            remove_issue_label validated
            remove_issue_label security-needs-fixes
            remove_issue_label security-review-required
          else
            echo "Update validation result is invalid." >&2
            exit 1
          fi

      - name: Clear stale update workflow status
        id: clear-status
        if: needs.analyze.result == 'success' && steps.reports.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation trust
          status_ids="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-update-workflow-status -->"))) | .id'
          )"
          while IFS= read -r status_id; do
            [ -z "$status_id" ] && continue
            require_issue_mutation trust
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${status_id}"
            mark_issue_mutation
          done <<< "$status_ids"

      - name: Recheck issue trust state after update mutations
        id: postflight
        if: needs.analyze.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          decision="$("$RUNNER_TEMP/guard-issue-mutation" postflight)"
          case "$decision" in
            safe|fallback|stale) ;;
            *) exit 1 ;;
          esac

      - name: Record update report publication failure
        id: failure
        if: >-
          always() &&
          needs.analyze.result == 'success' &&
          (steps.initialize.outcome == 'failure' ||
           steps.current.outcome == 'failure' ||
           steps.download.outcome == 'failure' ||
           steps.reports.outcome == 'failure' ||
           steps.type-label.outcome == 'failure' ||
           steps.validation-report.outcome == 'failure' ||
           steps.baseline-report.outcome == 'failure' ||
           steps.labels.outcome == 'failure' ||
           steps.clear-status.outcome == 'failure' ||
           steps.postflight.outcome == 'failure')
        env:
          CURRENT_OUTCOME: ${{ steps.current.outcome }}
          TYPE_LABEL_OUTCOME: ${{ steps.type-label.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          VALIDATION_REPORT_OUTCOME: ${{ steps.validation-report.outcome }}
          BASELINE_REPORT_OUTCOME: ${{ steps.baseline-report.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
          CLEAR_STATUS_OUTCOME: ${{ steps.clear-status.outcome }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_OUTCOME" = failure ]; then
            reason="The update issue changed before results could be published."
          elif [ "$TYPE_LABEL_OUTCOME" = failure ]; then
            reason="The plugin update label could not be applied."
          elif [ "$DOWNLOAD_OUTCOME" = failure ] || [ "$REPORTS_OUTCOME" = failure ]; then
            reason="The analyzed update reports failed integrity verification."
          elif [ "$VALIDATION_REPORT_OUTCOME" = failure ] || [ "$BASELINE_REPORT_OUTCOME" = failure ]; then
            reason="The update result could not be published to the issue."
          elif [ "$LABELS_OUTCOME" = failure ]; then
            reason="The update status labels could not be applied."
          elif [ "$CLEAR_STATUS_OUTCOME" = failure ]; then
            reason="A stale update workflow status could not be cleared."
          else
            reason="The update result publication did not complete."
          fi
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

      - name: Confirm failed run still matches the issue
        id: failure-current
        if: >-
          always() &&
          (needs.route.result == 'failure' ||
           needs.analyze.result == 'failure' ||
           steps.failure.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if jq -e --arg title "$EXPECTED_TITLE" --arg body "$EXPECTED_BODY" '
            .state == "open" and (.pull_request | not) and .title == $title and .body == $body
          ' <<< "$issue" >/dev/null; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "Issue changed after this run started; skipping stale failure mutations."
          fi

      - name: Clear stale update approval state
        if: >-
          always() &&
          env.MUTATION_CONCURRENCY_GROUP == 'plugin-catalog-writes' &&
          (needs.route.result == 'failure' ||
           needs.analyze.result == 'failure' ||
           steps.failure.outcome == 'success') &&
          steps.failure-current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          for label in validated needs-fixes approved-and-verified approved-for-listing maintainer-verified security-needs-fixes security-review-required; do
            remove_issue_label "$label" general
          done

      - name: Report plugin update workflow failure
        if: >-
          always() &&
          env.MUTATION_CONCURRENCY_GROUP == 'plugin-catalog-writes' &&
          (needs.route.result == 'failure' ||
           needs.analyze.result == 'failure' ||
           steps.failure.outcome == 'success') &&
          steps.failure-current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_REASON: ${{ steps.failure.outputs.reason || needs.analyze.outputs.failure_reason }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/issue-mutation-helpers"
          require_issue_mutation general
          reason="${FAILURE_REASON:-The plugin update workflow did not complete.}"
          report="$RUNNER_TEMP/plugin-update-workflow-status.md"
          printf '<!-- marketplace-update-workflow-status -->\n**Plugin update workflow failed:** %s The current marketplace snapshot remains unchanged. A maintainer must review the workflow before retrying.\n\nWorkflow: %s\n' \
            "$reason" "$RUN_URL" > "$report"
          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-update-workflow-status -->"))) | .id' \
              | tail -n 1
          )"
          require_issue_mutation general
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/plugin-update-workflow-status.json"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/plugin-update-workflow-status.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi
          mark_issue_mutation

      - name: Route incomplete update mutation through the global fallback
        id: fallback
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          TYPE_LABEL_OUTCOME: ${{ steps.type-label.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          VALIDATION_REPORT_OUTCOME: ${{ steps.validation-report.outcome }}
          BASELINE_REPORT_OUTCOME: ${{ steps.baseline-report.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
          CLEAR_STATUS_OUTCOME: ${{ steps.clear-status.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          required=false
          if [ "$MUTATION_CONCURRENCY_GROUP" != plugin-catalog-writes ]; then
            if [ -f "$RUNNER_TEMP/issue-mutation-stop" ] && \
               [ "$(cat "$RUNNER_TEMP/issue-mutation-stop")" = fallback ]; then
              required=true
            fi
            for outcome in "$INITIALIZE_OUTCOME" "$TYPE_LABEL_OUTCOME" "$DOWNLOAD_OUTCOME" "$REPORTS_OUTCOME" \
              "$VALIDATION_REPORT_OUTCOME" "$BASELINE_REPORT_OUTCOME" "$LABELS_OUTCOME" \
              "$CLEAR_STATUS_OUTCOME" "$POSTFLIGHT_OUTCOME"; do
              if [ "$outcome" = failure ]; then
                required=true
              fi
            done
            if [ "$JOB_STATUS" = failure ]; then
              required=true
            fi
          fi
          echo "required=${required}" >> "$GITHUB_OUTPUT"

  publish-fallback:
    if: >-
      always() &&
      (needs.publish.outputs.requires_global_fallback == 'true' ||
       (needs.publish.result == 'failure' &&
        needs.mutation-route.outputs.group == format('issue-validation-{0}', github.event.issue.number)))
    needs: [route, analyze, mutation-route, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: plugin-catalog-writes
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EXPECTED_TITLE: ${{ github.event.issue.title }}
      EXPECTED_BODY: ${{ github.event.issue.body }}
      EXPECTED_TYPE_LABEL: plugin-update
      MUTATION_CONCURRENCY_GROUP: plugin-catalog-writes
    steps: *update-mutation-steps
