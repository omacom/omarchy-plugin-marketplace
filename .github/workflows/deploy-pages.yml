name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      catalog_sha: ${{ steps.catalog.outputs.sha256 }}
      explorer_sha: ${{ steps.catalog.outputs.explorer_sha }}
      commit: ${{ steps.identity.outputs.commit }}
      pages_artifact_name: ${{ steps.identity.outputs.pages_name }}
      deployment_id: ${{ steps.identity.outputs.deployment_id }}
    steps:
      - name: Check out current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Record immutable artifact identity
        id: identity
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          deployment_id="push-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "pages_name=committed-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$deployment_id" > site/deployment-id.txt

      - name: Test committed marketplace
        run: npm test

      - name: Record committed catalog and Explorer checksums
        id: catalog
        run: |
          set -euo pipefail
          read -r catalog_sha _ < <(sha256sum site/catalog.json)
          read -r explorer_sha _ < <(sha256sum site/explorer-data.json)
          echo "sha256=${catalog_sha}" >> "$GITHUB_OUTPUT"
          echo "explorer_sha=${explorer_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.identity.outputs.pages_name }}
          path: site
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deployments
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify tested commit is still current
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_main" ] || [ "$remote_main" != "$EXPECTED_COMMIT" ]; then
            echo "main changed before deployment; refusing to deploy an older artifact." >&2
            exit 1
          fi

      - name: Deploy tested GitHub Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.prepare.outputs.pages_artifact_name }}
          timeout: 300000

      - name: Confirm deployed catalog and Explorer data after Pages timeout
        if: steps.deployment.outcome == 'failure'
        env:
          EXPECTED_CATALOG_SHA: ${{ needs.prepare.outputs.catalog_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.prepare.outputs.explorer_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment_id }}
        run: |
          set -euo pipefail
          live_catalog="$RUNNER_TEMP/live-catalog.json"
          live_explorer="$RUNNER_TEMP/live-explorer-data.json"
          live_deployment_id="$RUNNER_TEMP/live-deployment-id.txt"
          for (( attempt = 1; attempt <= 12; attempt++ )); do
            check_url="https://omarchyplugins.com/catalog.json?deployment-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            explorer_url="https://omarchyplugins.com/explorer-data.json?deployment-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            marker_url="https://omarchyplugins.com/deployment-id.txt?deployment-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 10 \
              --output "$live_deployment_id" "$marker_url" \
              && curl --fail --silent --show-error --location --max-time 10 \
                --output "$live_catalog" "$check_url" \
              && curl --fail --silent --show-error --location --max-time 10 \
                --output "$live_explorer" "$explorer_url"; then
              read -r live_catalog_sha _ < <(sha256sum "$live_catalog")
              read -r live_explorer_sha _ < <(sha256sum "$live_explorer")
              live_id="$(tr -d '\r\n' < "$live_deployment_id")"
              if [[ $live_id == "$EXPECTED_DEPLOYMENT_ID" \
                && $live_catalog_sha == "$EXPECTED_CATALOG_SHA" \
                && $live_explorer_sha == "$EXPECTED_EXPLORER_SHA" ]]; then
                echo "The expected catalog and Explorer data are live despite the Pages action timeout."
                exit 0
              fi
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done

          echo "::error::Pages deployment failed and the expected catalog and Explorer data did not become live."
          exit 1
